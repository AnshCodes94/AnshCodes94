<svg width="900" height="150" viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="skyFT" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1445"/>
      <stop offset="50%" stop-color="#0e0a2e"/>
      <stop offset="100%" stop-color="#050318"/>
    </linearGradient>
    <linearGradient id="bendFT1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3EA5" stop-opacity="0"/>
      <stop offset="35%" stop-color="#8A2BE2" stop-opacity="0.5"/>
      <stop offset="65%" stop-color="#12E7C7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2FD8FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bendFT2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2FD8FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5B6DFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF3EA5" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="gPy" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3776AB"/><stop offset="100%" stop-color="#FFD43B"/></linearGradient>
    <linearGradient id="gJava" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f89820"/><stop offset="100%" stop-color="#5382a1"/></linearGradient>
    <linearGradient id="gC" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#004482"/><stop offset="100%" stop-color="#659AD2"/></linearGradient>
    <linearGradient id="gHtml" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E34F26"/><stop offset="100%" stop-color="#F16529"/></linearGradient>
    <linearGradient id="gCss" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1572B6"/><stop offset="100%" stop-color="#33A9DC"/></linearGradient>
    <linearGradient id="gJs" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F7DF1E"/><stop offset="100%" stop-color="#E8C400"/></linearGradient>
    <linearGradient id="gSql" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00758F"/><stop offset="100%" stop-color="#F29111"/></linearGradient>
    <linearGradient id="gGit" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F05032"/><stop offset="100%" stop-color="#c53e26"/></linearGradient>
    <linearGradient id="gGh" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4a4a4a"/><stop offset="100%" stop-color="#181717"/></linearGradient>
    <linearGradient id="gVs" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#007ACC"/><stop offset="100%" stop-color="#0098FF"/></linearGradient>
    <linearGradient id="gVc" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3a3a3a"/><stop offset="100%" stop-color="#000000"/></linearGradient>

    <clipPath id="clipFT">
      <rect x="0" y="0" width="900" height="150" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipFT)">
    <rect x="0" y="0" width="900" height="150" fill="url(#skyFT)"/>

    <!-- aurora bends -->
    <path d="M -50,110 C 120,50 250,130 400,70 C 540,15 660,100 800,50 C 860,30 900,60 950,40 L 950,150 L -50,150 Z" fill="url(#bendFT1)"/>
    <path d="M -50,40 C 180,110 320,10 480,70 C 610,120 730,40 870,90 L 950,80 L 950,150 L -50,150 Z" fill="url(#bendFT2)"/>

    <!-- stars -->
    <g fill="#ffffff">
      <path d="M 60,20 L 60.8,22 L 63,22.6 L 60.8,23.2 L 60,25.2 L 59.2,23.2 L 57,22.6 L 59.2,22 Z" opacity="0.85"/>
      <path d="M 840,18 L 840.7,19.8 L 842.5,20.4 L 840.7,21 L 840,22.8 L 839.3,21 L 837.5,20.4 L 839.3,19.8 Z" opacity="0.8"/>
      <circle cx="450" cy="15" r="1" opacity="0.6"/>
      <circle cx="250" cy="130" r="1" opacity="0.6"/>
      <circle cx="700" cy="125" r="1" opacity="0.6"/>
    </g>

    <!-- label -->
    <text x="450" y="34" font-family="'Fira Code', monospace" font-size="13" font-weight="600" fill="#7fe9ff" text-anchor="middle" letter-spacing="2">TECH STACK</text>

    <!-- tech badges row -->
    <g font-family="'Fira Code', monospace" font-weight="700" fill="#ffffff" text-anchor="middle">
      <g><circle cx="50" cy="75" r="20" fill="url(#gPy)"/><text x="50" y="80" font-size="12">Py</text></g>
      <g><circle cx="130" cy="75" r="20" fill="url(#gJava)"/><text x="130" y="80" font-size="11">Java</text></g>
      <g><circle cx="210" cy="75" r="20" fill="url(#gC)"/><text x="210" y="80" font-size="14">C</text></g>
      <g><circle cx="290" cy="75" r="20" fill="url(#gHtml)"/><text x="290" y="80" font-size="10">HTML</text></g>
      <g><circle cx="370" cy="75" r="20" fill="url(#gCss)"/><text x="370" y="80" font-size="10">CSS</text></g>
      <g><circle cx="450" cy="75" r="20" fill="url(#gJs)"/><text x="450" y="80" font-size="12" fill="#1a1445">JS</text></g>
      <g><circle cx="530" cy="75" r="20" fill="url(#gSql)"/><text x="530" y="80" font-size="10">SQL</text></g>
      <g><circle cx="610" cy="75" r="20" fill="url(#gGit)"/><text x="610" y="80" font-size="10">Git</text></g>
      <g><circle cx="690" cy="75" r="20" fill="url(#gGh)"/><text x="690" y="80" font-size="10">GH</text></g>
      <g><circle cx="770" cy="75" r="20" fill="url(#gVs)"/><text x="770" y="80" font-size="9">VS</text></g>
      <g><circle cx="850" cy="75" r="20" fill="url(#gVc)"/><text x="850" y="82" font-size="16">▲</text></g>
    </g>

    <!-- footer tagline -->
    <text x="450" y="128" font-family="'Fira Code', monospace" font-size="13" fill="#c9c3ff" text-anchor="middle" letter-spacing="0.5">Made with ❤️ by Ansh Bansal</text>
  </g>
</svg>
