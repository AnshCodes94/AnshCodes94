      <stop offset="100%" stop-color="#d8d2ff"/>
    </linearGradient>
    <clipPath id="clipHD">
      <rect x="0" y="0" width="900" height="220" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipHD)">
