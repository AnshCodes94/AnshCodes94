<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="skyHD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050318"/>
      <stop offset="50%" stop-color="#0e0a2e"/>
      <stop offset="100%" stop-color="#1a1445"/>
    </linearGradient>
    <linearGradient id="bendHD1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12E7C7" stop-opacity="0"/>
      <stop offset="35%" stop-color="#12E7C7" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#8A2BE2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF3EA5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bendHD2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3EA5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5B6DFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2FD8FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bendHD3" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2FD8FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#12E7C7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
