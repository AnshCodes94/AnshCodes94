    <!-- aurora bends -->
    <path d="M -50,170 C 100,90 220,190 350,110 C 480,30 600,140 730,70 C 800,35 850,90 950,50 L 950,220 L -50,220 Z" fill="url(#bendHD1)"/>
    <path d="M -50,60 C 150,150 280,20 420,100 C 540,165 650,60 780,120 C 850,150 900,100 950,140 L 950,220 L -50,220 Z" fill="url(#bendHD2)"/>
    <path d="M -50,110 C 200,60 350,150 500,90 C 620,45 750,110 950,70 L 950,220 L -50,220 Z" fill="url(#bendHD3)"/>

    <!-- stars scattered -->
    <g fill="#ffffff">
      <path d="M 70,30 L 71.2,33 L 74,34 L 71.2,35 L 70,38 L 68.8,35 L 66,34 L 68.8,33 Z" opacity="0.9"/>
      <path d="M 830,25 L 831,27.4 L 833.4,28 L 831,28.6 L 830,31 L 829,28.6 L 826.6,28 L 829,27.4 Z" opacity="0.85"/>
      <path d="M 760,45 L 760.7,46.8 L 762.5,47.5 L 760.7,48.2 L 760,50 L 759.3,48.2 L 757.5,47.5 L 759.3,46.8 Z" opacity="0.7"/>
      <path d="M 130,180 L 130.7,181.8 L 132.5,182.5 L 130.7,183.2 L 130,185 L 129.3,183.2 L 127.5,182.5 L 129.3,181.8 Z" opacity="0.75"/>
      <path d="M 550,20 L 550.6,21.4 L 552,22 L 550.6,22.6 L 550,24 L 549.4,22.6 L 548,22 L 549.4,21.4 Z" opacity="0.7"/>
      <circle cx="200" cy="60" r="1.3" opacity="0.8"/>
      <circle cx="670" cy="185" r="1.3" opacity="0.75"/>
      <circle cx="880" cy="150" r="1.1" opacity="0.7"/>
      <circle cx="40" cy="140" r="1.1" opacity="0.7"/>
      <circle cx="420" cy="30" r="1" opacity="0.6"/>
      <circle cx="300" cy="190" r="1" opacity="0.6"/>
      <circle cx="900" cy="90" r="0.9" opacity="0.6"/>
    </g>

    <!-- centered logo monogram -->
    <circle cx="450" cy="72" r="42" fill="url(#logoGrad)"/>
    <circle cx="450" cy="72" r="42" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="450" y="86" font-family="'Fira Code', monospace" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">AB</text>

    <!-- name -->
    <text x="450" y="155" font-family="'Fira Code', monospace" font-size="46" font-weight="700" fill="url(#nameGrad)" text-anchor="middle" letter-spacing="3">ANSH BANSAL</text>

    <!-- tagline -->
    <text x="450" y="185" font-family="'Fira Code', monospace" font-size="16" font-weight="500" fill="#7fe9ff" text-anchor="middle" letter-spacing="1">CS Student | Java, Python &amp; Frontend Developer</text>
