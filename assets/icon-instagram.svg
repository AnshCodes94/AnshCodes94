<svg width="240" height="60" viewBox="0 0 240 60" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="skyIG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050318"/>
      <stop offset="55%" stop-color="#0e0a2e"/>
      <stop offset="100%" stop-color="#1a1445"/>
    </linearGradient>
    <linearGradient id="bendIG1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12E7C7" stop-opacity="0"/>
      <stop offset="45%" stop-color="#12E7C7" stop-opacity="0.65"/>
      <stop offset="75%" stop-color="#8A2BE2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF3EA5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bendIG2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3EA5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#B14BFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2FD8FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glyphIG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEDA75"/>
      <stop offset="35%" stop-color="#FA7E1E"/>
      <stop offset="65%" stop-color="#D62976"/>
      <stop offset="100%" stop-color="#962FBF"/>
    </linearGradient>
    <clipPath id="clipIG">
      <rect x="0" y="0" width="240" height="60" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipIG)">
    <rect x="0" y="0" width="240" height="60" fill="url(#skyIG)"/>

    <!-- aurora bends -->
    <path d="M -20,45 C 40,10 90,55 140,20 C 180,-5 220,25 260,5 L 260,60 L -20,60 Z" fill="url(#bendIG1)"/>
    <path d="M -20,15 C 50,45 100,0 160,30 C 195,48 225,15 260,35 L 260,60 L -20,60 Z" fill="url(#bendIG2)"/>

    <!-- stars -->
    <g fill="#ffffff">
      <path d="M 30,10 L 31,13 L 34,14 L 31,15 L 30,18 L 29,15 L 26,14 L 29,13 Z" opacity="0.9"/>
      <path d="M 205,12 L 206,14.2 L 208,15 L 206,15.8 L 205,18 L 204,15.8 L 202,15 L 204,14.2 Z" opacity="0.8"/>
      <path d="M 160,8 L 160.7,9.6 L 162,10 L 160.7,10.4 L 160,12 L 159.3,10.4 L 158,10 L 159.3,9.6 Z" opacity="0.7"/>
      <circle cx="55" cy="48" r="1.1" opacity="0.8"/>
      <circle cx="190" cy="46" r="1" opacity="0.7"/>
      <circle cx="120" cy="9" r="1" opacity="0.6"/>
      <circle cx="15" cy="30" r="0.9" opacity="0.6"/>
    </g>

    <!-- badge circle + glyph -->
    <circle cx="30" cy="30" r="16" fill="url(#glyphIG)"/>
    <rect x="21" y="21" width="18" height="18" rx="6" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <circle cx="30" cy="30" r="5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <circle cx="35.5" cy="24.5" r="1.4" fill="#ffffff"/>

    <text x="58" y="36" font-family="'Fira Code', monospace" font-size="17" font-weight="600" fill="#ffffff">Instagram</text>
  </g>
</svg>
