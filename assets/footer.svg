<svg width="920" height="160" viewBox="0 0 920 160" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="skyF3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#03060c"/>
      <stop offset="50%" stop-color="#050510"/>
      <stop offset="100%" stop-color="#020103"/>
    </linearGradient>

    <linearGradient id="streakTealF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12E7C7" stop-opacity="0"/>
      <stop offset="45%" stop-color="#12E7C7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#12E7C7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streakPurpleF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A2BE2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8A2BE2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streakPinkF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3EA5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF3EA5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF3EA5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streakBlueF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2FD8FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2FD8FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2FD8FF" stop-opacity="0"/>
    </linearGradient>

    <filter id="streakBlurF" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <linearGradient id="gPyF" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3776AB"/><stop offset="100%" stop-color="#FFD43B"/></linearGradient>
    <linearGradient id="gJavaF" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f89820"/><stop offset="100%" stop-color="#5382a1"/></linearGradient>
    <linearGradient id="gCF" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#004482"/><stop offset="100%" stop-color="#659AD2"/></linearGradient>
    <linearGradient id="gHtmlF" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E34F26"/><stop offset="100%" stop-color="#F16529"/></linearGradient>
    <linearGradient id="gCssF" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1572B6"/><stop offset="100%" stop-color="#33A9DC"/></linearGradient>
    <linearGradient id="gJsF" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F7DF1E"/><stop offset="100%" stop-color="#E8C400"/></linearGradient>
    <linearGradient id="gSqlF" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00758F"/><stop offset="100%" stop-color="#F29111"/></linearGradient>
    <linearGradient id="gGitF" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F05032"/><stop offset="100%" stop-color="#c53e26"/></linearGradient>
    <linearGradient id="gGhF" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4a4a4a"/><stop offset="100%" stop-color="#181717"/></linearGradient>
    <linearGradient id="gVsF" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#007ACC"/><stop offset="100%" stop-color="#0098FF"/></linearGradient>
    <linearGradient id="gVcF" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3a3a3a"/><stop offset="100%" stop-color="#000000"/></linearGradient>

    <clipPath id="clipF3">
      <rect x="0" y="0" width="920" height="160" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipF3)">
    <rect x="0" y="0" width="920" height="160" fill="url(#skyF3)"/>

    <!-- animated flowing aurora streaks -->
    <g filter="url(#streakBlurF)">
      <g opacity="0.5">
        <path d="M -100,30 C 120,-10 260,80 460,35 C 640,-5 760,60 1020,25" fill="none" stroke="url(#streakTealF)" stroke-width="3">
          <animateTransform attributeName="transform" type="translate" values="-18 0; 18 -6; -18 0" dur="9.5s" repeatCount="indefinite"/>
        </path>
        <animate attributeName="opacity" values="0.3;0.55;0.3" dur="7s" repeatCount="indefinite"/>
      </g>
      <g opacity="0.4">
        <path d="M -100,70 C 100,110 260,25 440,80 C 620,130 780,55 1020,95" fill="none" stroke="url(#streakPurpleF)" stroke-width="3.5">
          <animateTransform attributeName="transform" type="translate" values="14 0; -14 8; 14 0" dur="11.5s" repeatCount="indefinite"/>
        </path>
        <animate attributeName="opacity" values="0.25;0.5;0.25" dur="8s" repeatCount="indefinite"/>
      </g>
      <g opacity="0.35">
        <path d="M -100,115 C 150,90 300,140 500,105 C 680,72 820,125 1020,100" fill="none" stroke="url(#streakBlueF)" stroke-width="2.5">
          <animateTransform attributeName="transform" type="translate" values="-12 0; 16 6; -12 0" dur="13s" repeatCount="indefinite"/>
        </path>
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="9s" repeatCount="indefinite"/>
      </g>
      <g opacity="0.3">
        <path d="M -100,145 C 120,125 280,155 480,132 C 660,110 800,150 1020,128" fill="none" stroke="url(#streakPinkF)" stroke-width="2">
          <animateTransform attributeName="transform" type="translate" values="10 0; -16 -5; 10 0" dur="10.5s" repeatCount="indefinite"/>
        </path>
        <animate attributeName="opacity" values="0.18;0.35;0.18" dur="6.5s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- tiny stars -->
    <g fill="#ffffff">
      <circle cx="60" cy="20" r="1" opacity="0.5"/>
      <circle cx="840" cy="18" r="1" opacity="0.5"/>
      <circle cx="450" cy="15" r="0.9" opacity="0.45"/>
      <circle cx="250" cy="130" r="0.9" opacity="0.4"/>
      <circle cx="700" cy="125" r="0.9" opacity="0.4"/>
    </g>

    <!-- label -->
    <text x="460" y="34" font-family="'Fira Code', monospace" font-size="13" font-weight="600" fill="#7fe9ff" text-anchor="middle" letter-spacing="2">TECH STACK</text>

    <!-- tech badges row -->
    <g font-family="'Fira Code', monospace" font-weight="700" fill="#ffffff" text-anchor="middle">
      <g><circle cx="50" cy="75" r="20" fill="url(#gPyF)"/><text x="50" y="80" font-size="12">Py</text></g>
      <g><circle cx="130" cy="75" r="20" fill="url(#gJavaF)"/><text x="130" y="80" font-size="11">Java</text></g>
      <g><circle cx="210" cy="75" r="20" fill="url(#gCF)"/><text x="210" y="80" font-size="14">C</text></g>
      <g><circle cx="290" cy="75" r="20" fill="url(#gHtmlF)"/><text x="290" y="80" font-size="10">HTML</text></g>
      <g><circle cx="370" cy="75" r="20" fill="url(#gCssF)"/><text x="370" y="80" font-size="10">CSS</text></g>
      <g><circle cx="450" cy="75" r="20" fill="url(#gJsF)"/><text x="450" y="80" font-size="12" fill="#1a1445">JS</text></g>
      <g><circle cx="530" cy="75" r="20" fill="url(#gSqlF)"/><text x="530" y="80" font-size="10">SQL</text></g>
      <g><circle cx="610" cy="75" r="20" fill="url(#gGitF)"/><text x="610" y="80" font-size="10">Git</text></g>
      <g><circle cx="690" cy="75" r="20" fill="url(#gGhF)"/><text x="690" y="80" font-size="10">GH</text></g>
      <g><circle cx="770" cy="75" r="20" fill="url(#gVsF)"/><text x="770" y="80" font-size="9">VS</text></g>
      <g><circle cx="850" cy="75" r="20" fill="url(#gVcF)"/><text x="850" y="82" font-size="16">&#9650;</text></g>
    </g>

    <!-- footer tagline -->
    <text x="460" y="128" font-family="'Fira Code', monospace" font-size="15" font-weight="600" fill="#e8f6ff" text-anchor="middle" letter-spacing="1">Thanks for Stopping By! &#10024;</text>
  </g>
</svg>
