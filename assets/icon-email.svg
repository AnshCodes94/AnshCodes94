<svg width="240" height="60" viewBox="0 0 240 60" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="skyEM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050318"/>
      <stop offset="55%" stop-color="#0e0a2e"/>
      <stop offset="100%" stop-color="#1a1445"/>
    </linearGradient>
    <linearGradient id="bendEM1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2FD8FF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#2FD8FF" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#5B6DFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#B14BFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bendEM2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3EA5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF7A5C" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#12E7C7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glyphEM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A5C"/>
      <stop offset="100%" stop-color="#D14836"/>
    </linearGradient>
    <clipPath id="clipEM">
      <rect x="0" y="0" width="240" height="60" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipEM)">
    <rect x="0" y="0" width="240" height="60" fill="url(#skyEM)"/>

    <!-- aurora bends -->
    <path d="M -20,40 C 30,15 80,50 130,18 C 175,-8 215,28 260,8 L 260,60 L -20,60 Z" fill="url(#bendEM1)"/>
    <path d="M -20,20 C 55,48 105,5 165,32 C 200,48 230,18 260,38 L 260,60 L -20,60 Z" fill="url(#bendEM2)"/>

    <!-- stars -->
    <g fill="#ffffff">
      <path d="M 28,9 L 29,11.4 L 31.5,12 L 29,12.6 L 28,15 L 27,12.6 L 24.5,12 L 27,11.4 Z" opacity="0.9"/>
      <path d="M 200,15 L 200.8,17 L 203,17.5 L 200.8,18 L 200,20 L 199.2,18 L 197,17.5 L 199.2,17 Z" opacity="0.8"/>
      <path d="M 165,7 L 165.6,8.4 L 167,8.8 L 165.6,9.2 L 165,10.6 L 164.4,9.2 L 163,8.8 L 164.4,8.4 Z" opacity="0.7"/>
      <circle cx="50" cy="47" r="1.1" opacity="0.8"/>
      <circle cx="185" cy="45" r="1" opacity="0.7"/>
      <circle cx="115" cy="10" r="1" opacity="0.6"/>
      <circle cx="12" cy="26" r="0.9" opacity="0.6"/>
    </g>

    <!-- badge circle + glyph (envelope) -->
    <circle cx="30" cy="30" r="16" fill="url(#glyphEM)"/>
    <rect x="21" y="23" width="18" height="14" rx="2" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <path d="M 21.5,23.5 L 30,31 L 38.5,23.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="58" y="36" font-family="'Fira Code', monospace" font-size="17" font-weight="600" fill="#ffffff">Email</text>
  </g>
</svg>
