<svg width="920" height="320" viewBox="0 0 920 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="skyH3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020103"/>
      <stop offset="50%" stop-color="#050510"/>
      <stop offset="100%" stop-color="#03060c"/>
    </linearGradient>

    <linearGradient id="streakTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12E7C7" stop-opacity="0"/>
      <stop offset="45%" stop-color="#12E7C7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#12E7C7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streakPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A2BE2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8A2BE2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streakPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3EA5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF3EA5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF3EA5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streakBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2FD8FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2FD8FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2FD8FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="logoGradH3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2FD8FF"/>
      <stop offset="50%" stop-color="#8A2BE2"/>
      <stop offset="100%" stop-color="#FF3EA5"/>
    </linearGradient>
    <linearGradient id="nameGradH3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#bfe9ff"/>
      <stop offset="100%" stop-color="#7fe9ff"/>
    </linearGradient>

    <filter id="streakBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="softGlowH3" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="logoGlowH3" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <clipPath id="clipH3">
      <rect x="0" y="0" width="920" height="320" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipH3)">
    <rect x="0" y="0" width="920" height="320" fill="url(#skyH3)"/>

    <!-- animated flowing aurora streaks (lash-like) -->
    <g filter="url(#streakBlur)">
      <g opacity="0.55">
        <path d="M -100,60 C 120,10 260,140 460,70 C 640,10 760,120 1020,50" fill="none" stroke="url(#streakTeal)" stroke-width="3.5">
          <animateTransform attributeName="transform" type="translate" values="-20 0; 20 -10; -20 0" dur="9s" repeatCount="indefinite"/>
        </path>
        <animate attributeName="opacity" values="0.35;0.6;0.35" dur="7s" repeatCount="indefinite"/>
      </g>
      <g opacity="0.45">
        <path d="M -100,140 C 100,200 260,60 440,150 C 620,235 780,110 1020,180" fill="none" stroke="url(#streakPurple)" stroke-width="4">
          <animateTransform attributeName="transform" type="translate" values="15 0; -15 12; 15 0" dur="11s" repeatCount="indefinite"/>
        </path>
        <animate attributeName="opacity" values="0.3;0.55;0.3" dur="8s" repeatCount="indefinite"/>
      </g>
      <g opacity="0.4">
        <path d="M -100,230 C 150,180 300,290 500,220 C 680,155 820,250 1020,200" fill="none" stroke="url(#streakBlue)" stroke-width="3">
          <animateTransform attributeName="transform" type="translate" values="-12 0; 18 8; -12 0" dur="13s" repeatCount="indefinite"/>
        </path>
        <animate attributeName="opacity" values="0.25;0.5;0.25" dur="9s" repeatCount="indefinite"/>
      </g>
      <g opacity="0.35">
        <path d="M -100,290 C 120,250 280,320 480,270 C 660,225 800,300 1020,260" fill="none" stroke="url(#streakPink)" stroke-width="2.5">
          <animateTransform attributeName="transform" type="translate" values="10 0; -18 -6; 10 0" dur="10s" repeatCount="indefinite"/>
        </path>
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="6.5s" repeatCount="indefinite"/>
      </g>
      <g opacity="0.3">
        <path d="M -100,10 C 140,50 300,-20 520,30 C 700,70 840,10 1020,45" fill="none" stroke="url(#streakTeal)" stroke-width="2">
          <animateTransform attributeName="transform" type="translate" values="-10 0; 14 6; -10 0" dur="12s" repeatCount="indefinite"/>
        </path>
        <animate attributeName="opacity" values="0.15;0.35;0.15" dur="8.5s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- tiny stars -->
    <g fill="#ffffff">
      <circle cx="150" cy="55" r="1.2" opacity="0.6"/>
      <circle cx="760" cy="190" r="1.2" opacity="0.55"/>
      <circle cx="500" cy="45" r="1" opacity="0.5"/>
      <circle cx="230" cy="120" r="1.1" opacity="0.55"/>
      <circle cx="690" cy="60" r="1" opacity="0.5"/>
      <circle cx="130" cy="255" r="1" opacity="0.5"/>
      <circle cx="780" cy="270" r="1" opacity="0.5"/>
      <circle cx="60" cy="150" r="0.9" opacity="0.45"/>
      <path d="M 850,80 L 850.8,82 L 853,82.6 L 850.8,83.2 L 850,85.2 L 849.2,83.2 L 847,82.6 L 849.2,82 Z" opacity="0.7"/>
      <path d="M 90,95 L 90.8,97 L 93,97.6 L 90.8,98.2 L 90,100.2 L 89.2,98.2 L 87,97.6 L 89.2,97 Z" opacity="0.65"/>
    </g>

    <!-- glowing avatar -->
    <circle cx="460" cy="90" r="46" fill="url(#logoGradH3)" filter="url(#logoGlowH3)" opacity="0.55"/>
    <circle cx="460" cy="90" r="44" fill="none" stroke="url(#logoGradH3)" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.85"/>
    <clipPath id="avatarClip">
      <circle cx="460" cy="90" r="35"/>
    </clipPath>
    <image x="425" y="55" width="70" height="70" href="https://avatars.githubusercontent.com/u/230945199?v=4" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>
    <circle cx="460" cy="90" r="35" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>

    <!-- name -->
    <text x="460" y="185" font-family="'Fira Code', monospace" font-size="52" font-weight="700" fill="url(#nameGradH3)" text-anchor="middle" letter-spacing="4" filter="url(#softGlowH3)">ANSH BANSAL</text>

    <!-- subtitle -->
    <text x="460" y="215" font-family="'Fira Code', monospace" font-size="16" font-weight="600" fill="#7fe9ff" text-anchor="middle" letter-spacing="2">CS STUDENT &#183; B.TECH COMPUTER SCIENCE &amp; ENGINEERING</text>

    <!-- tech stack line -->
    <text x="460" y="242" font-family="'Fira Code', monospace" font-size="13" font-weight="500" fill="#9fb3d9" text-anchor="middle" letter-spacing="1.5">HTML &#183; CSS &#183; JAVASCRIPT &#183; SQL &#183; PYTHON &#183; JAVA &#183; C</text>

    <!-- divider -->
    <line x1="390" y1="262" x2="530" y2="262" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>

    <!-- tagline -->
    <text x="460" y="285" font-family="'Fira Code', monospace" font-size="13" fill="#8fa3c9" text-anchor="middle" letter-spacing="0.5">Building things &amp; breaking things, one commit at a time</text>
  </g>
</svg>
